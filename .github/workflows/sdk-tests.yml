name: SDK tests

on:
  push:
    branches:
      - main
      - dev
      - stage
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; every push to a
# branch keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit tests, build and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Type check
        run: yarn tsc --noEmit

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Documentation
        run: yarn docs:check

  anvil:
    name: Contracts on anvil
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAVINCI_CONTRACTS_DIR: ${{ github.workspace }}/.deps/davinci-contracts
      DAVINCI_CENSUS_CONTRACT_DIR: ${{ github.workspace }}/.deps/davinci-onchain-census-contract
      DAVINCI_ANVIL_CACHE: ${{ github.workspace }}/.deps/cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The contracts the vendored ABIs were built from: the suite deploys the same commits.
      - name: Read the pinned contract commits
        id: pins
        run: |
          for pin in contracts:src/contracts/abi/source.json census:src/contracts/abi/census/source.json; do
            name="${pin%%:*}"
            file="${pin#*:}"
            repository="$(jq -r .repository "$file")"
            commit="$(jq -r .commit "$file")"
            if ! [[ "$repository" =~ ^https://github\.com/vocdoni/[A-Za-z0-9._-]+$ && "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error file=$file::not a vocdoni repository at a full commit"
              exit 1
            fi
            echo "${name}-repository=${repository#https://github.com/}" >> "$GITHUB_OUTPUT"
            echo "${name}-commit=${commit}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout davinci-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts-repository }}
          ref: ${{ steps.pins.outputs.contracts-commit }}
          path: .deps/davinci-contracts
          submodules: recursive
          persist-credentials: false

      - name: Checkout davinci-onchain-census-contract
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.census-repository }}
          ref: ${{ steps.pins.outputs.census-commit }}
          path: .deps/davinci-onchain-census-contract
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Anvil suite
        run: yarn test:anvil

      - name: Print the anvil log on failure
        if: failure()
        run: tail -n 300 "$DAVINCI_ANVIL_CACHE/anvil.log" || true
