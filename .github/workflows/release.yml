name: Release

## Releases are driven by Changesets (.changeset/*.md). On every push to main, after
## the tests pass:
##
## - while there are changesets, changesets/action opens or updates the "Version
##   Packages" pull request, which bumps package.json, writes the CHANGELOG.md entry
##   and rebuilds llms-full.txt (`yarn version-packages`);
## - once that pull request is merged (no changesets left), `yarn release` publishes
##   the new version to npm, and the action tags the commit as v<version> and creates
##   the GitHub release from its CHANGELOG.md entry. A version already on npm is not
##   published again, so other pushes do nothing.
##
## npm uses trusted publishing (OIDC), so there is no npm token to rotate. The npm
## trusted publisher for @vocdoni/davinci-sdk must point to this file: release.yml.

on:
  push:
    branches:
      - main

permissions:
  contents: read

## A release must never be cancelled halfway; later pushes wait their turn. The
## group differs from the one sdk-tests.yml takes when called from here
## (`Release-<ref>`), which would deadlock.
concurrency:
  group: changesets-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ## The same checks as on every PR, on the commit that gets released
  tests:
    uses: ./.github/workflows/sdk-tests.yml
    with:
      ref: ${{ github.sha }}

  release:
    name: Version pull request or publish
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: write       ## the version branch, the tag and the GitHub release
      pull-requests: write  ## the "Version Packages" pull request
      id-token: write       ## npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          ## changelog-github finds the pull request of each changeset in the history
          fetch-depth: 0

      ## Trusted publishing needs npm >= 11.5.1, which doesn't run on node 20
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install deps & build
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn run build

      ## changesets/action v2 requires @changesets/cli v3, which doesn't support Yarn 1
      - name: Version pull request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: yarn version-packages
          publish: yarn release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          jq -r '.[] | "Published \(.name)@\(.version): https://www.npmjs.com/package/\(.name)/v/\(.version)"' \
            <<<"$PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
