# Generator of ../census-files.json. Place this directory next to a
# davinci-sequencer checkout (whose workspace expects davinci-zkvm beside it)
# and run `cargo run --release > census-files.json`.
[package]
name = "census-gen"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
davinci-client = { path = "../davinci-sequencer/client", default-features = false }
davinci-sequencer = { path = "../davinci-sequencer/sequencer" }
davinci-zkvm-sdk = { path = "../davinci-zkvm/rust-sdk" }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
