# Generator of ../tracker.json. Place this directory next to a davinci-sequencer
# checkout (whose workspace expects davinci-zkvm beside it) and run
# `cargo run --release > tracker.json`.
[package]
name = "tracker-gen"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
arbo = { path = "../davinci-sequencer/arbo", default-features = false }
davinci-client = { path = "../davinci-sequencer/client", default-features = false }
serde_json = "1"
hex = "0.4"
